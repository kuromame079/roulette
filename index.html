:root{--bg:#e9efe6;--fg:#3b4a4f;--dim:#8a9a9e;--ln:#d3ddd7;--ring:#fff;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-d]{--bg:#2b3a3f;--fg:#eaf2ee;--dim:#8fa3a8;--ln:#4a5d62;--ring:#f3f7f4;--card:#374a50}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px sans-serif}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
hr{width:100%;border:0;border-top:1px solid var(--ln);margin:6px 0}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
button:disabled{color:var(--dim)}.go{background:#3498db;color:#fff;border:0}.red{background:#e74c3c!important;color:#fff!important}
.hd,.bar,.ft,.r,.tb{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 12px}
.hd b{font-size:20px}.dim{color:var(--dim)}.st{display:flex;align-items:center;gap:8px}
.ls,.grid{flex:1;overflow:auto}.wc{flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:6vh}
svg{width:min(88%,340px)}.res{text-align:center;min-height:2.4em;font-weight:bold;padding:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;align-content:start}.cd{border:1px solid var(--ln);border-radius:10px;padding:6px;text-align:center}.cd svg{width:100%}
.row{position:relative;overflow:hidden;border-bottom:1px solid var(--ln);touch-action:pan-y}
.ct{position:relative;background:var(--bg);padding:12px;transition:transform .2s;display:flex;align-items:center;gap:6px}
.ac{position:absolute;top:0;bottom:0;display:flex;align-items:center}.a-l{right:0}.a-r{left:0}
.ac button{height:100%;border:0;border-radius:0;background:#3498db;color:#fff;min-width:50px;padding:0 4px}
.row[data-s=l] .ct{transform:translateX(calc(-1*var(--lw,128px)))}.row[data-s=r] .ct{transform:translateX(var(--rw,64px))}
.row[data-s=r] .a-l,.row[data-s=l] .a-r,.row:not([data-s]) .ac,.row[data-s=''] .ac{visibility:hidden}
.bd{position:absolute;inset:0;background:#0006;z-index:5}.dw{width:60%;height:100%;background:var(--bg);display:flex;flex-direction:column;padding:8px;box-sizing:border-box;font-size:13px}
.il{flex:1;overflow:auto}.df{display:flex;justify-content:space-between;padding-top:6px}.mi{padding:8px 2px}
.m{position:absolute;inset:0;background:#0006;z-index:9;display:flex;align-items:center;justify-content:center}
.bx{background:var(--bg);border-radius:16px;padding:16px;width:78%;box-sizing:border-box}.m.f{background:var(--bg);flex-direction:column;align-items:stretch;justify-content:flex-start}.m.f .bx{width:auto;border-radius:0;flex:1;overflow:auto;padding:10px 12px;background:var(--bg)}.gc{border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}.gc b{font-size:17px}.gc div{color:var(--dim);font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fb{padding:10px 12px;border-top:1px solid var(--ln)}.fb button{width:100%}
.bx input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;margin:8px 0;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px}
.bt{display:flex;justify-content:space-between;margin-top:8px}small{color:var(--dim)}
textarea{flex:1;margin:8px 12px;width:auto;resize:none}.tb{flex-wrap:wrap}.hl{display:flex;gap:8px;padding:6px 14px}
input.cl{width:22px;height:22px;border:0;padding:0;border-radius:50%;background:none}input.cl::-webkit-color-swatch-wrapper{padding:0}input.cl::-webkit-color-swatch{border:0;border-radius:50%}
.tt{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;z-index:20}
.sp2{display:flex;align-items:center;gap:4px;height:100%;padding:0 6px;background:var(--bg);border-left:1px solid var(--ln);box-sizing:border-box}
.sp2 button{height:auto;min-width:26px;width:26px;padding:2px 0;border:1px solid var(--ln);border-radius:6px;background:none;color:var(--fg)}.sp2 b{min-width:18px;text-align:center}
.go{padding:10px 26px;border-radius:12px;font-weight:bold}.ft{padding:10px 16px}.st button{width:38px;padding:6px 0}.ct{padding:15px 14px}
.hd{padding:10px 14px}.hd button,.bar button{padding:8px 14px}.r{border-bottom:1px solid var(--ln);padding:10px 14px}.tb button{flex:1;padding:8px 2px;font-size:13px}.mi{padding:10px 4px}
.res{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;position:relative;min-height:3.4em;padding:8px}
.chip{padding:8px 20px;border-radius:999px;color:#fff;font-size:22px;font-weight:bold;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.r .chip{font-size:15px;padding:3px 12px}.r[id^=res]{justify-content:flex-start!important}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
i.cf{position:absolute;top:0;width:8px;height:8px;border-radius:2px;animation:fall 1.4s ease-out forwards;pointer-events:none}
@keyframes fall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy,80px)) rotate(360deg);opacity:0}}
button{white-space:nowrap}.bar,.hd{flex-wrap:nowrap}.bar span{font-size:14px;white-space:nowrap}.bar button{padding:8px 10px;font-size:14px}.bar .go{padding:8px 14px}.tb{flex-wrap:nowrap;gap:4px;padding:6px 8px}.tb button{font-size:12px;padding:8px 0;min-width:0}
button[data-a=hok],button[data-a=svr],button[data-a=sg],button[data-a=gs],button[data-a=msave]{background:#e74c3c;color:#fff;border:0}
button[data-a=svr]:disabled{background:none;border:1px solid var(--ln);color:var(--dim)}
.ew{position:relative;flex:1;margin:8px 12px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
#bk,#ta{position:absolute;inset:0;margin:0!important;padding:8px;border:0!important;font:16px/1.4 sans-serif;white-space:pre;box-sizing:border-box;width:100%;height:100%}
#bk{overflow:hidden;pointer-events:none;color:var(--fg)}#bk div{min-height:1.4em}
#ta{background:transparent!important;color:transparent!important;-webkit-text-fill-color:transparent;caret-color:var(--fg);resize:none;overflow:auto;outline:none}
.ls.fr{margin:8px 12px;border:1px solid var(--ln);border-radius:8px}.eye{font-size:12px;padding:3px 10px;border-radius:999px}
.go{background:#23b4c4!important}
button[data-a=menu],button[data-a=tomulti]{width:44px;height:44px;border-radius:50%;border:0;background:#9e9e9e;color:#fff;font-size:20px;padding:0}button[data-a=tomulti]{background:#23b4c4}

button{background:var(--card);border:0;border-radius:999px;color:var(--fg)}

.hd button[data-a=home]{background:#1fb5c5;color:#fff}

.ac button{border-radius:0}.sp2{background:var(--card)}
.r{background:var(--card);border:0;border-radius:14px;margin:6px 12px;padding:10px 14px}
.cd{background:var(--card);border:0;border-radius:18px}.ew,.ls.fr{background:var(--card);border:0;border-radius:14px}

.r[id^=res]{background:none;margin:0;padding:2px 14px;border-radius:0}
.cd{background:var(--bg)!important;border:2px solid var(--card)!important}
